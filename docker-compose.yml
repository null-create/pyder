version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyder
    volumes:
      - app_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONFAULTHANDLER=1
      - PYTHONHASHSEED=random
      - PIP_NO_CACHE_DIR=1
      - PIP_DISABLE_PIP_VERSION_CHECK=1
    command: ["python", "crawlers.py"]
    restart: unless-stopped

volumes:
  app_data:
